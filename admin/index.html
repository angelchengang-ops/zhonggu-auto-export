<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中谷汽车官网后台</title>
  <style>
    body { margin:0; background:#f5f7fb; color:#172033; font-family:Arial,"Microsoft YaHei",sans-serif; }
    .shell { width:min(1080px, calc(100% - 32px)); margin:36px auto; }
    .topbar { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; }
    h1 { margin:0 0 8px; font-size:30px; }
    p { margin:0; color:#667085; line-height:1.6; }
    .userbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .pill { display:inline-flex; min-height:30px; align-items:center; padding:0 10px; border-radius:999px; background:#eaf2ff; color:#153f75; font-size:13px; font-weight:800; }
    .btn { min-height:36px; padding:0 12px; border-radius:7px; border:1px solid #cfd7e6; background:#fff; color:#172033; cursor:pointer; text-decoration:none; font:inherit; font-weight:700; display:inline-flex; align-items:center; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin:22px 0 0; }
    .stat { padding:16px; border:1px solid #e3e8f2; border-radius:8px; background:#fff; box-shadow:0 10px 28px rgba(15,23,42,.05); }
    .stat small { display:block; color:#667085; margin-bottom:6px; }
    .stat strong { color:#153f75; font-size:28px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin-top:24px; }
    .card { display:flex; flex-direction:column; gap:12px; min-height:132px; padding:18px; border:1px solid #e3e8f2; border-radius:8px; background:#fff; text-decoration:none; color:inherit; box-shadow:0 10px 28px rgba(15,23,42,.06); }
    .card h2 { margin:0; font-size:19px; }
    .card .go { margin-top:auto; display:inline-flex; width:max-content; min-height:36px; align-items:center; padding:0 12px; border-radius:7px; background:#153f75; color:#fff; font-weight:700; }
    .status { margin-top:12px; color:#b42318; }
    @media (max-width:760px) { .topbar { flex-direction:column; } .userbar { justify-content:flex-start; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">中谷汽车官网后台</h1>
        <p id="pageSubtitle">轻量 CRM 第一版，用于查看询盘、分配负责人和跟进客户。</p>
      </div>
      <div class="userbar">
        <span class="pill" id="currentUser">正在验证登录...</span>
        <button class="btn" id="logoutBtn" type="button">退出登录</button>
      </div>
    </header>

    <section class="stats" id="stats"></section>
    <p class="status" id="status"></p>

    <section class="grid" id="featureGrid"></section>
  </main>
  <script>
    const esc = (value) => String(value ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
    const item = (label, value) => `<article class="stat"><small>${esc(label)}</small><strong>${esc(value ?? 0)}</strong></article>`;
    const card = (entry) => `<a class="card" href="${esc(entry.href)}"><h2>${esc(entry.title)}</h2><p>${esc(entry.description)}</p><span class="go">进入</span></a>`;
    const status = document.getElementById("status");
    const adminCards = [
      { title:"询盘管理", description:"查看、筛选、分配、备注、导出官网询盘。", href:"/admin/inquiries.html" },
      { title:"员工管理", description:"维护管理员和业务员账号、角色、WhatsApp 和负责市场。", href:"/admin/employees.html" },
      { title:"WhatsApp 设置", description:"统一维护前台 WhatsApp 号码、业务员号码和消息模板。", href:"/admin/whatsapp-settings.html" },
      { title:"新车智能上架", description:"采集车型图片到内部待审核目录，确认授权前不发布。", href:"/admin/new-car-intake.html" },
      { title:"新车图片映射", description:"维护新车主图绑定，不包含二手车媒体。", href:"/admin/image-mapping.html" },
      { title:"二手车媒体管理", description:"维护二手车多图片、多视频和封面图。", href:"/admin/used-car-media.html" },
      { title:"网站首页预览", description:"打开当前本地官网首页。", href:"/" }
    ];
    const salesCards = [
      { title:"我的线索", description:"查看分配给我的客户，联系客户并填写跟进记录。", href:"/admin/inquiries.html" },
      { title:"今日待跟进", description:"查看今天需要联系或二次跟进的客户。", href:"/admin/inquiries.html?due=today" },
      { title:"跟进记录", description:"查看我自己的客户沟通和状态记录。", href:"/admin/inquiries.html?view=records" }
    ];
    async function requireLogin() {
      const res = await fetch("/api/admin/me", { cache:"no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) { window.location.href = "/admin/login.html"; return null; }
      document.getElementById("currentUser").textContent = `${data.user.name} / ${data.user.role}`;
      return data.user;
    }
    function renderHome(user) {
      const admin = user.role === "admin";
      document.title = admin ? "中谷汽车官网后台" : "中谷汽车销售后台";
      document.getElementById("pageTitle").textContent = admin ? "中谷汽车官网后台" : "中谷汽车销售后台";
      document.getElementById("pageSubtitle").textContent = admin ? "轻量 CRM 第一版，用于查看询盘、分配负责人和跟进客户。" : "查看分配给我的客户，联系客户并填写跟进记录。";
      document.getElementById("featureGrid").innerHTML = (admin ? adminCards : salesCards).map(card).join("");
    }
    async function loadStats(user) {
      const res = await fetch("/api/admin/inquiry-stats", { cache:"no-store" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.success === false) throw new Error(data.error || "统计加载失败");
      const s = data.stats || {};
      const html = user.role === "admin"
        ? [item("今日询盘", s.today), item("未处理询盘", s.new), item("今日 WhatsApp 点击", s.whatsappToday), item("当前总询盘", s.total)].join("")
        : [item("我的未处理线索", s.new), item("今日待联系", s.todayDue ?? s.dueToday), item("已联系客户", s.contacted), item("成交客户", s.won)].join("");
      document.getElementById("stats").innerHTML = html;
    }
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/admin/logout", { method:"POST" }).catch(() => {});
      window.location.href = "/admin/login.html";
    });
    (async () => {
      try { const user = await requireLogin(); if (user) { renderHome(user); await loadStats(user); } }
      catch (error) { status.textContent = error.message; }
    })();
  </script>
</body>
</html>
