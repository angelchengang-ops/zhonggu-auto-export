<body>
  <main class="shell">
    <header class="topbar"><div><h1 id="pageTitle">询盘管理</h1><p id="pageSubtitle">轻量 CRM：网站询盘、WhatsApp 点击线索、分配改派、跟进记录和筛选导出。</p></div><div class="userbar"><span class="pill" id="currentUser">正在验证登录...</span><a class="btn" href="/admin/">后台首页</a><a class="btn" id="siteHomeLink" href="/">网站首页</a><a class="btn btn-primary" id="exportBtn" href="/api/admin/inquiries/export.csv">导出当前筛选 CSV</a><button class="btn" id="manualBtn" type="button">新增线索</button><button class="btn" id="logoutBtn" type="button">退出登录</button></div></header>
    <section class="stats" id="stats"></section>

20851;&#38381;</option></select></label><label class="field"><span>市场</span><select name="market"><option value="">全部</option><option>Algeria</option><option>West Africa</option><option>Central Asia</option><option>Southeast Asia</option><option>Middle East</option><option>South America</option><option>Russia/CIS</option><option>Used Cars</option><option>Other</option></select></label><label class="field" id="salesField"><span>负责人</span><select name="assignedTo" id="salesFilter"><option value="">全部</option></select></label><label class="field"><span>关键词搜索</span><input class="keyword" name="q" placeholder="姓名 / 国家 / WhatsApp / 车型 / 留言 / 来源页面"></label><button class="btn btn-primary" type="submit">筛选</button><button class="btn" id="resetFilters" type="button">清空</button><button class="btn" id="refresh" type="button">刷新</button></form></section>

  <div class="toast" id="toast"></div>
  <dialog id="assignDialog"><form method="dialog" class="dialog-body"><h2 id="assignTitle" style="margin:0 0 12px;font-size:20px">分配客户</h2><p id="assignCurrent" style="margin-bottom:12px"></p><label class="field"><span>选择新负责人</span><select id="assignSelect"></select></label><div class="dialog-actions"><button class="btn" value="cancel">取消</button><button class="btn btn-primary" id="confirmAssign" value="default">确认分配</button></div></form></dialog>
  <dialog id="noteDialog"><form method="dialog" class="dialog-body"><h2 style="margin:0 0 12px;font-size:20px">添加跟进记录</h2><textarea id="noteInput" placeholder="填写跟进记录、报价情况或客户偏好"></textarea><div class="dialog-actions"><button class="btn" value="cancel">取消</button><button class="btn btn-primary" id="saveNote" value="default">保存</button></div></form></dialog>
  <dialog id="manualDialog"><form method="dialog" class="dialog-body" id="manualForm"><h2 style="margin:0 0 12px;font-size:20px">新增线索</h2><div class="dialog-grid"><label class="field"><span>姓名</span><input name="name"></label><label class="field"><span>国家</span><input name="country"></label><label class="field"><span>WhatsApp</span><input name="whatsapp"></label><label class="field"><span>Email</span><input type="email" name="email" placeholder="your@email.com"></label><label class="field"><span>车型</span><input name="interestedModel"></label><label class="field"><span>数量</span><input name="quantity"></label><label class="field"><span>FOB/CIF</span><select name="quoteType"><option>&#26410;&#30830;&#35748;</option><option>FOB</option><option>CIF</option></select></label><label class="field"><span>目的港</span><input name="destinationPort"></label><label class="field"><span>来源类型</span><select name="sourceDetail"><option value="manual">手动录入</option><option value="whatsapp_customer">WhatsApp 客户</option><option value="phone">电话客户</option><option value="exhibition">展会客户</option><option value="referral">老客户转介绍</option><option value="email_reply">开发信回复</option><option value="other">其他</option></select></label><label class="field"><span>负责人</span><select name="assignedTo" id="manualAssigned"></select></label><label class="field" style="grid-column:1 / -1"><span>留言</span><textarea name="message"></textarea></label></div><div class="dialog-actions"><button class="btn" id="cancelManual" type="button">取消</button><button class="btn btn-primary" id="saveManual" type="button">保存</button></div></form></dialog>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = { user:null, salesUsers:[], inquiries:[], whatsappClicks:[], whatsappClicksLoaded:false, selectedId:"", editingId:"", assigningId:"", tab:"website", due:"" };
    const statusText = { whatsapp_lead:"WhatsApp点击", new:"未处理", assigned:"已分配", contacted:"已跟进", quoted:"已报价", waiting:"等待回复", won:"成交", lost:"失效", closed:"关闭" };
    const formalSources = new Set(["website_form","manual","email_reply","referral","phone","exhibition","other"]);
    const sourceText = { website_form:"\u7f51\u7ad9\u8be2\u76d8", whatsapp_form:"\u7f51\u7ad9\u8be2\u76d8", whatsapp_click:"WhatsApp \u70b9\u51fb", manual:"\u624b\u52a8\u5f55\u5165", email_reply:"\u5f00\u53d1\u4fe1\u56de\u590d", referral:"\u8001\u5ba2\u6237\u8f6c\u4ecb\u7ecd", phone:"\u7535\u8bdd\u5ba2\u6237", exhibition:"\u5c55\u4f1a\u5ba2\u6237", other:"\u5176\u4ed6", codex_validation:"\u6d4b\u8bd5\u6570\u636e", unknown:"\u672a\u77e5\u6765\u6e90" };
    const entryText = { normal_form:"\u666e\u901a\u7f51\u7ad9\u8868\u5355", whatsapp_button:"WhatsApp \u6309\u94ae\u8868\u5355", home_get_fob:"\u9996\u9875 Get FOB Price", vehicle_button:"\u8f66\u8f86\u8be6\u60c5\u9875\u6309\u94ae", landing_button:"\u843d\u5730\u9875\u6309\u94ae", quick_quote:"\u5feb\u901f\u8be2\u4ef7\u8868\u5355", unknown:"\u672a\u77e5\u6765\u6e90\u5165\u53e3" };
        const adminStatGroups = [{title:"\u5ba2\u6237\u7ebf\u7d22\u7edf\u8ba1",items:[["\u603b\u5ba2\u6237\u7ebf\u7d22","customerLeads.total"],["\u5168\u90e8\u7ebf\u7d22","source.allLeads"],["\u4eca\u65e5\u65b0\u589e\u5ba2\u6237","customerLeads.today"],["\u6628\u65e5\u65b0\u589e\u5ba2\u6237","customerLeads.yesterday"],["\u8fd1 7 \u5929\u5ba2\u6237","customerLeads.last7Days"],["\u672c\u6708\u5ba2\u6237","customerLeads.thisMonth"]]},{title:"\u6765\u6e90\u7edf\u8ba1",items:[["\u7f51\u7ad9\u8be2\u76d8","source.websiteForm"],["WhatsApp \u6309\u94ae\u8868\u5355","source.whatsappForm"],["\u624b\u52a8\u5f55\u5165","source.manual"],["WhatsApp \u70b9\u51fb","source.whatsappClickLeads"],["WhatsApp \u539f\u59cb\u70b9\u51fb\u6b21\u6570","source.whatsappRawClicks"],["WhatsApp \u70b9\u51fb\u8f6c\u8868\u5355\u6570","source.whatsappConvertedClicks"],["WhatsApp \u70b9\u51fb\u8f6c\u5316\u7387","source.whatsappClickConversionRate"]]},{title:"\u5206\u914d\u7edf\u8ba1",items:[["\u672a\u5206\u914d","assignment.unassigned"],["\u5df2\u5206\u914d","assignment.assigned"],["Chen Gang","assignment.admin_chen"],["\u90d1\u56fd\u5fd7","assignment.sales_zheng"]]},{title:"\u8ddf\u8fdb\u72b6\u6001\u7edf\u8ba1",items:[["\u65b0\u7ebf\u7d22","status.new"],["\u5df2\u8054\u7cfb","status.contacted"],["\u5df2\u62a5\u4ef7","status.quoted"],["\u7b49\u5f85\u56de\u590d","status.waiting"],["\u6210\u4ea4","status.won"],["\u5931\u6548","status.lost"],["\u5df2\u5173\u95ed","status.closed"]]}];
    const salesStats = [["我的未处理线索","new"],["今日待联系","todayDue"],["已联系客户","contacted"],["成交客户","won"]];
    const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const val = (v) => String(v ?? "").trim();
    const assignmentKey = (v="") => val(v).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,"_").replace(/^_+|_+$/g,"");
    const assignmentAliases = { admin_chen:["Chen Gang","chen_gang","admin"], sales_zheng:["郑国志","zheng_guozhi","zheng"] };
    const userAssignmentKeys = (user={}) => new Set([user.id,user.username,user.name,user.displayName,...(assignmentAliases[user.id]||[])].map(assignmentKey).filter(Boolean));
    const itemAssignmentValues = (item={}) => [item.assignedTo,item.assigned_to,item.assignedName,item.assigned_name,item.salesId,item.sales_id,item.salesName,item.sales_name,item.owner,item.ownerName,item.raw?.assignedTo,item.raw?.assigned_to,item.raw?.assignedName,item.raw?.assigned_name];
    const itemAssignedToUser = (item={}, user={}) => { const keys=userAssignmentKeys(user); return itemAssignmentValues(item).some(v=>keys.has(assignmentKey(v))); };
    const pathValue = (obj, path) => path.split(".").reduce((acc, key) => acc && acc[key] !== undefined ? acc[key] : undefined, obj);
    const statValue = (obj, path) => pathValue(obj, path) ?? 0;
    const normalizeSourceValue = (source = "") => {
      const value = val(source).toLowerCase();
      if(value==="whatsapp \u70b9\u51fb"||value==="whatsapp_click") return "whatsapp_click";
      if(value==="\u624b\u52a8\u5f55\u5165"||value==="manual") return "manual";
      if(value==="unknown") return "unknown";
      return "website_form";
    };
    const getLeadSourceType = (lead) => {
      if (!lead || typeof lead !== "object" || Array.isArray(lead)) return "unknown";
      const sourceType = val(lead.sourceType || lead.source_type || lead.raw?.sourceType || lead.raw?.source_type).toLowerCase();
      const source = val(lead.source || lead.raw?.source).toLowerCase();
      if (sourceType === "whatsapp_click" || source === "whatsapp_click") return "whatsapp_click";
      if (sourceType === "manual" || source === "manual") return "manual";
      if (sourceType === "unknown") return "unknown";
      return "website_form";
    };
    const isWhatsappButtonEntry = (lead) => {
      if (!lead || typeof lead !== "object" || Array.isArray(lead)) return false;
      const sourceType = val(lead.sourceType || lead.source_type || lead.raw?.sourceType || lead.raw?.source_type).toLowerCase();
      const source = val(lead.source || lead.raw?.source).toLowerCase();
      const sourceChannel = val(lead.sourceChannel || lead.source_channel || lead.raw?.sourceChannel || lead.raw?.source_channel).toLowerCase();
      const sourceSubType = val(lead.sourceSubType || lead.source_sub_type || lead.raw?.sourceSubType || lead.raw?.source_sub_type).toLowerCase();
      const createdFrom = val(lead.createdFrom || lead.created_from || lead.raw?.createdFrom || lead.raw?.created_from).toLowerCase();
      const sourceDetail = val(lead.sourceDetail || lead.source_detail || lead.raw?.sourceDetail || lead.raw?.source_detail).toLowerCase();
      return sourceType === "whatsapp_form" || source === "whatsapp_form" || sourceChannel === "whatsapp_button" || sourceSubType === "website_whatsapp_button" || createdFrom === "website_whatsapp_button" || sourceDetail.includes("whatsapp");
    };
    const getLeadEntryType = (lead) => {
      if (!lead || typeof lead !== "object" || Array.isArray(lead)) return "unknown";
      const sourceEntry = val(lead.sourceEntry || lead.source_entry || lead.raw?.sourceEntry || lead.raw?.source_entry).toLowerCase();
      const sourceDetail = val(lead.sourceDetail || lead.source_detail || lead.raw?.sourceDetail || lead.raw?.source_detail).toLowerCase();
      const sourceSubType = val(lead.sourceSubType || lead.source_sub_type || lead.raw?.sourceSubType || lead.raw?.source_sub_type).toLowerCase();
      const source = val(lead.source || lead.raw?.source).toLowerCase();
      const sourceButton = val(lead.sourceButton || lead.source_button || lead.buttonText || lead.button_text || lead.raw?.sourceButton || lead.raw?.buttonText).toLowerCase();
      const sourcePage = val(lead.sourcePage || lead.source_page || lead.pageUrl || lead.page_url || lead.sourceUrl || lead.source_url || lead.raw?.sourcePage || lead.raw?.sourceUrl).toLowerCase();
      const vehicle = val(lead.vehicle || lead.interestedModel || lead.interested_model).toLowerCase();
      if (sourceEntry.includes("quick_quote") || sourceDetail.includes("quick_quote") || sourceSubType.includes("quick_quote") || source.includes("quick_quote")) return "quick_quote";
      if ((sourcePage === "/" || sourcePage.includes("/index.html")) && (sourceButton.includes("get fob price") || sourceButton.includes("ask for fob price"))) return "home_get_fob";
      if (sourcePage.includes("/vehicles/") || (vehicle && vehicle !== "general vehicle inquiry" && vehicle !== "vehicles from zhonggu auto export")) return "vehicle_button";
      if (sourcePage.includes("landing") || sourceEntry.includes("landing")) return "landing_button";
      if (isWhatsappButtonEntry(lead)) return "whatsapp_button";
      return "normal_form";
    };
    const getLeadEntryLabel = (lead) => entryText[getLeadEntryType(lead)] || entryText.normal_form;
    const leadEntryMatches = (lead, entry = "") => {
      const value = val(entry);
      if (!value) return true;
      if (value === "whatsapp_button") return isWhatsappButtonEntry(lead);
      return getLeadEntryType(lead) === value;
    };
    const normalizeSource = getLeadSourceType;
    const isValidLeadRecord = (item) => !!item && typeof item === "object" && !Array.isArray(item);
    function safeLeads(rawLeads, label="leads"){
      const list = Array.isArray(rawLeads) ? rawLeads : [];
      const safe = list.filter(isValidLeadRecord);
      const skipped = list.length - safe.length;
      if (skipped > 0) console.warn("[CRM] skipped invalid lead records: " + skipped, { label });
      return safe;
    }
    const sourceSubTypeText = (item) => isWhatsappButtonEntry(item) ? val(item?.sourceSubType||item?.source_sub_type||item?.raw?.sourceSubType||item?.raw?.source_sub_type||item?.createdFrom||item?.created_from||item?.raw?.createdFrom||item?.raw?.created_from||"website_whatsapp_button") : val(item?.sourceSubType||item?.source_sub_type||item?.raw?.sourceSubType||item?.raw?.source_sub_type||item?.createdFrom||item?.created_from||item?.raw?.createdFrom||item?.raw?.created_from||item?.sourceDetail||item?.source_detail||item?.raw?.sourceDetail||item?.raw?.source_detail);
    const startOfLocalDay = (offset=0) => { const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()+offset); };
    const startOfLocalMonth = () => { const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); };
    const dateInRange = (value,start,end=null) => { const d=new Date(value||0); return !Number.isNaN(d.getTime()) && d>=start && (!end || d<end); };
    const isCustomerLead = (item) => ["website_form","manual"].includes(getLeadSourceType(item));
    const isAssignedToActiveUser = (item) => state.salesUsers.some(u=>itemAssignedToUser(item,u));
    function statsFromItems(items=[], raw={}){
      items=safeLeads(items,"stats");

    function notificationText(item, assignee){ if(!item||!assignee)return""; if(getLeadSourceType(item)==="whatsapp_click"||item.status==="whatsapp_lead"||!item.whatsapp)return`${assignee.name}，有一个 WhatsApp 点击线索需要确认：\n\n来源页面：${item.pageUrl||"-"}\n车型：${item.interestedModel||"-"}\n市场：${item.market||"-"}\n客户号码：未知\n说明：客户点击了 WhatsApp 按钮，但系统无法确认是否已发送消息。\n\n请留意对应 WhatsApp 咨询，并在后台更新状态。`; return`${assignee.name}，新分配一个客户，请跟进：\n\n客户：${item.name||"-"}\n国家/市场：${item.country||"-"} / ${item.market||"-"}\n车型：${item.interestedModel||"-"}\n数量：${item.quantity||"-"}\n报价类型：${item.quoteType||"-"}\n目的港：${item.destinationPort||"-"}\n客户 WhatsApp：${item.whatsapp||"-"}\n留言：${item.message||"-"}\n来源页面：${item.pageUrl||"-"}\n\n请及时联系客户并在后台更新跟进状态。`; }
    function detailItem(label,value,full=false){return`<div class="detail-item ${full?"full":""}"><small>${esc(label)}</small><div>${esc(value||"-")}</div></div>`;}
    function renderRows(){
      const list=safeLeads(state.inquiries,"render rows");
      if(list.length !== (Array.isArray(state.inquiries) ? state.inquiries.length : 0)) state.inquiries=list;
      const rows=list.map(item=>{
        const source=getLeadSourceType(item);
        const isClick=source==="whatsapp_click";
        const customerName=item.name||item.customerName||"\u5ba2\u6237\u672a\u77e5";
        const vehicle=item.vehicle||item.interestedModel||"-";
        const quoteType=item.quoteType||item.fobCif||"Unknown";
        const link=waLink(item.whatsapp);
        const assignLabel=hasValidAssignee(item)?"\u6539\u6d3e":"\u5206\u914d\u5ba2\u6237";
        const clickAction=item.converted===true?(item.convertedLeadId?'<button class="btn btn-green" data-action="view-related" data-lead-id="'+esc(item.convertedLeadId)+'">\u67e5\u770b\u5173\u8054\u7ebf\u7d22</button>':'<button class="btn" disabled>\u5df2\u8f6c\u5316</button>'):'<button class="btn" disabled>\u672a\u8f6c\u5316</button>';
        const actions=isClick?clickAction:(link?'<button class="btn btn-green" data-action="contact" data-id="'+esc(item.id)+'">\u8054\u7cfb\u5ba2\u6237</button>':'<button class="btn" disabled>\u65e0\u5ba2\u6237 WhatsApp</button>')+(state.user?.role==="admin"?'<button class="btn" data-action="assign" data-id="'+esc(item.id)+'">'+assignLabel+'</button>':"");
        return '<tr class="'+(item.id===state.selectedId?"selected":"")+'" data-id="'+esc(item.id)+'"><td>'+esc(fmt(item.createdAt))+'</td><td class="compact">'+esc(customerName)+'</td><td class="compact">'+esc(countryMarketText(item))+'</td><td>'+esc(isClick?"-":(item.rawWhatsapp||item.whatsapp||"-"))+'</td><td class="compact">'+esc(vehicle)+'</td><td>'+esc(isClick?"-":(item.quantity||"-"))+'</td><td>'+esc(isClick?"-":quoteType)+'</td><td class="compact">'+esc(isClick?"-":(item.destinationPort||"-"))+'</td><td>'+esc(sourceText[source]||"\u672a\u77e5\u6765\u6e90")+'</td><td><span class="badge badge-'+esc(displayStatusClass(item))+'">'+esc(displayStatus(item))+'</span></td><td>'+esc(isClick?"\u672a\u5206\u914d":salesNameForItem(item))+'</td><td class="actions">'+actions+'</td></tr>';
      }).join("");
      $("rows").innerHTML=rows;
      $("empty").textContent=tabEmptyText();
      $("empty").hidden=list.length>0;
    }
        function renderClickDetail(item){
      const converted=item.converted===true;
      const description=converted?"\u8be5\u70b9\u51fb\u5df2\u8f6c\u5316\u4e3a\u7f51\u7ad9\u8be2\u76d8\u7ebf\u7d22\uff0c\u53ef\u5728\u7f51\u7ad9\u8be2\u76d8\u6216\u5168\u90e8\u7ebf\u7d22\u4e2d\u67e5\u770b\u6b63\u5f0f\u5ba2\u6237\u4fe1\u606f\u3002":"\u8be5\u8bb0\u5f55\u4ec5\u8868\u793a\u5ba2\u6237\u70b9\u51fb\u4e86 WhatsApp \u6309\u94ae\uff0c\u5c1a\u672a\u63d0\u4ea4\u8868\u5355\u3002";
      const fields=detailItem("\u70b9\u51fb\u65f6\u95f4",fmt(item.createdAt))+detailItem("\u6765\u6e90\u9875\u9762",item.sourcePage||item.pageUrl,true)+detailItem("\u6765\u6e90 URL",item.sourceUrl||item.pageUrl,true)+detailItem("\u6765\u6e90\u6309\u94ae",item.sourceButton)+detailItem("\u8f66\u578b",item.interestedModel||item.vehicle)+detailItem("\u5e02\u573a",item.market)+detailItem("leadSessionId",item.leadSessionId)+detailItem("\u8f6c\u5316\u72b6\u6001",converted?"\u5df2\u8f6c\u5316":"\u672a\u8f6c\u5316")+detailItem("\u5173\u8054\u7ebf\u7d22 ID",item.convertedLeadId)+detailItem("\u8f6c\u5316\u65f6\u95f4",fmt(item.convertedAt))+detailItem("\u76ee\u6807 WhatsApp \u53f7\u7801",item.waNumber||item.targetWhatsapp)+detailItem("IP",item.ip)+detailItem("userAgent",item.userAgent,true)+detailItem("\u4e8b\u4ef6\u7c7b\u578b",item.eventType)+detailItem("\u8bf4\u660e",description,true);
      const actions=converted&&item.convertedLeadId?'<button class="btn btn-green" data-detail-action="view-related" data-lead-id="'+esc(item.convertedLeadId)+'">\u67e5\u770b\u5173\u8054\u7ebf\u7d22</button>':'<button class="btn" data-detail-action="copy-url">\u590d\u5236\u6765\u6e90\u9875\u9762</button>';
      $("detailPanel").innerHTML='<h2>WhatsApp \u70b9\u51fb\u8be6\u60c5</h2><div class="detail-grid">'+fields+'</div><h3>\u64cd\u4f5c</h3><div class="detail-actions">'+actions+'</div>';
    }
        function renderDetail(){
      const item=selected();
      if(!isValidLeadRecord(item)){
        $("detailPanel").innerHTML=state.tab==="whatsapp"?'<h2>WhatsApp \u70b9\u51fb\u8be6\u60c5</h2><p>\u8bf7\u5728\u5de6\u4fa7\u9009\u62e9\u4e00\u6761\u70b9\u51fb\u8bb0\u5f55\u3002</p>':'<h2>\u7ebf\u7d22\u8be6\u60c5</h2><p>\u8bf7\u9009\u62e9\u4e00\u6761\u6709\u6548\u7ebf\u7d22\u3002</p>';
        return;
      }
      if(getLeadSourceType(item)==="whatsapp_click") return renderClickDetail(item);
      const source=getLeadSourceType(item);
      const sourceLabel=sourceText[source]||"\u672a\u77e5\u6765\u6e90";
      const sourceSubType=sourceSubTypeText(item);
      const entryLabel=getLeadEntryLabel(item);
      const canAssign=state.user?.role==="admin";
      const customerName=item.name||item.customerName||"\u5ba2\u6237\u672a\u77e5";
      const vehicle=item.vehicle||item.interestedModel||"-";
      const noteHtml=notes(item).length?notes(item).map(n=>'<div class="note"><strong>'+esc(fmt(n.createdAt))+" "+esc(n.authorName||"")+'</strong><br>'+esc(n.text||"")+'</div>').join(""):'<p>\u6682\u65e0\u8ddf\u8fdb\u8bb0\u5f55\u3002</p>';
      const waBtn=item.whatsapp?'<button class="btn" data-detail-action="copy-wa">\u590d\u5236 WhatsApp</button><button class="btn btn-green" data-detail-action="contact">\u8054\u7cfb\u5ba2\u6237</button>':'<button class="btn" disabled>\u65e0\u5ba2\u6237 WhatsApp</button>';
      const assignment=canAssign?'<button class="btn" data-detail-action="assign">'+(hasValidAssignee(item)?"\u6539\u6d3e":"\u5206\u914d\u5ba2\u6237")+'</button>':"";
      const adminDetailActions=canAssign?'<button class="btn" data-detail-action="copy-url">\u590d\u5236\u6765\u6e90\u9875\u9762</button><button class="btn" data-detail-action="copy-notice">\u590d\u5236\u901a\u77e5\u4e1a\u52a1\u5458\u6587\u6848</button>':"";
      const clickFields=(isWhatsappButtonEntry(item)||item.leadSessionId||item.hasRelatedWhatsappClick) ? detailItem("\u70b9\u51fb\u6765\u6e90",item.hasRelatedWhatsappClick?"\u662f":"\u5426")+detailItem("leadSessionId",item.leadSessionId)+detailItem("\u9996\u6b21\u70b9\u51fb\u65f6\u95f4",fmt(item.firstClickAt))+detailItem("\u6700\u8fd1\u70b9\u51fb\u65f6\u95f4",fmt(item.lastClickAt))+detailItem("\u63d0\u4ea4\u524d\u70b9\u51fb\u6b21\u6570",item.clickCountBeforeSubmit)+detailItem("\u5173\u8054\u70b9\u51fb\u8bb0\u5f55\u6570",Array.isArray(item.relatedClickIds)?item.relatedClickIds.length:0) : "";
      const duplicateFields=Number(item.duplicateSubmitCount||0)>0 ? detailItem("\u91cd\u590d\u63d0\u4ea4\u6b21\u6570",item.duplicateSubmitCount)+detailItem("\u6700\u8fd1\u91cd\u590d\u63d0\u4ea4\u65f6\u95f4",fmt(item.lastDuplicateSubmitAt)) : "";
      const fields=detailItem("\u5ba2\u6237\u59d3\u540d",customerName)+detailItem("WhatsApp",item.rawWhatsapp||item.whatsapp||"-")+detailItem("\u56fd\u5bb6\u533a\u53f7",item.countryCode)+detailItem("\u672c\u5730\u53f7\u7801",item.whatsappLocal)+detailItem("\u539f\u59cb WhatsApp",item.rawWhatsapp)+detailItem("\u89c4\u8303 WhatsApp",item.whatsapp)+detailItem("Email",item.email)+detailItem("\u56fd\u5bb6",item.country||"-")+detailItem("\u5e02\u573a",item.market||"Other")+detailItem("\u8f66\u578b",vehicle)+detailItem("\u6570\u91cf",item.quantity||"-")+detailItem("FOB/CIF",item.quoteType||item.fobCif||"Unknown")+detailItem("\u76ee\u7684\u6e2f",item.destinationPort||"-")+detailItem("\u6765\u6e90\u7c7b\u578b",sourceLabel)+detailItem("\u6765\u6e90\u5165\u53e3",entryLabel)+detailItem("\u6765\u6e90\u7ec6\u5206",sourceSubType)+detailItem("\u63d0\u4ea4\u65f6\u95f4",fmt(item.createdAt))+detailItem("\u5f53\u524d\u72b6\u6001",displayStatus(item))+detailItem("\u63d0\u4ea4\u6765\u6e90",item.createdFrom)+detailItem("\u6765\u6e90\u6309\u94ae",item.sourceButton)+detailItem("\u6765\u6e90\u9875\u9762",item.sourcePage||item.pageUrl,true)+detailItem("\u6765\u6e90 URL",item.sourceUrl||item.pageUrl,true)+clickFields+duplicateFields+detailItem("\u7559\u8a00",item.message,true);
      $("detailPanel").innerHTML='<h2>'+esc(customerName)+'</h2><p><span class="badge badge-'+esc(displayStatusClass(item))+'">'+esc(displayStatus(item))+'</span></p><div class="detail-grid">'+fields+detailItem("\u5f53\u524d\u8d1f\u8d23\u4eba",salesNameForItem(item))+detailItem("\u6700\u540e\u8ddf\u8fdb\u65f6\u95f4",fmt(item.lastFollowUpAt))+detailItem("\u5907\u6ce8",latestNote(item)?.text||item.note,true)+'</div><h3>\u64cd\u4f5c</h3><div class="detail-actions">'+waBtn+assignment+'<button class="btn" data-detail-action="status" data-status="contacted">\u6807\u8bb0\u5df2\u8054\u7cfb</button><button class="btn" data-detail-action="status" data-status="quoted">\u6807\u8bb0\u5df2\u62a5\u4ef7</button><button class="btn" data-detail-action="status" data-status="waiting">\u6807\u8bb0\u7b49\u5f85\u56de\u590d</button><button class="btn" data-detail-action="status" data-status="won">\u6807\u8bb0\u6210\u4ea4</button><button class="btn" data-detail-action="status" data-status="lost">\u6807\u8bb0\u5931\u6548</button><button class="btn" data-detail-action="status" data-status="closed">\u6807\u8bb0\u5df2\u5173\u95ed</button><button class="btn" data-detail-action="note">\u7f16\u8f91\u5907\u6ce8</button>'+adminDetailActions+'</div><h3>\u8ddf\u8fdb\u8bb0\u5f55</h3><div class="notes">'+noteHtml+'</div>';
    }
        function openAssignDialog(id){ const item=state.inquiries.find(i=>i.id===id)||selected(); if(!item)return; state.assigningId=item.id; $("assignTitle").textContent=item.assignedTo?"改派客户":"分配客户"; $("assignCurrent").textContent=`当前负责人：${salesName(item.assignedTo)}`; $("assignSelect").value=item.assignedTo||""; $("confirmAssign").textContent=item.assignedTo?"确认改派":"确认分配"; $("assignDialog").showModal(); }
    async function openRelatedLead(leadId){
      if(!leadId){ toast("\u5173\u8054\u7ebf\u7d22 ID \u7f3a\u5931\u3002", true); return; }
      state.tab="website";
      state.selectedId=leadId;
      document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab==="website"));
      updateTabHint();
      await loadInquiries();
      if(!state.inquiries.some(i=>i.id===leadId)){
        state.tab="all";
        state.selectedId=leadId;
        document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab==="all"));
        updateTabHint();
        await loadInquiries();
      }
      if(!state.inquiries.some(i=>i.id===leadId)) toast("\u672a\u627e\u5230\u5173\u8054\u7ebf\u7d22\u3002", true);
    }
    async function confirmAssign(){ const item=state.inquiries.find(i=>i.id===state.assigningId); if(!item)return; const to=$("assignSelect").value; if((item.assignedTo||"")===to){ toast(to ? `该客户已由 ${salesName(to)} 负责，无需重复分配。` : "该线索当前已是未分配，无需重复操作。",true); return; } if(item.assignedTo&&item.assignedTo!==to&&!confirm(`该客户当前负责人是 ${salesName(item.assignedTo)}，确认改派给 ${salesName(to)} 吗？`))return; const from=item.assignedTo; const updated=await patchInquiry(item.id,{assignedTo:to},"assign"); $("assignDialog").close(); toast(from?`已从 ${salesName(from)} 改派给 ${salesName(updated.assignedTo)}`:`已分配给 ${salesName(updated.assignedTo)}`); }
    $("tabs").addEventListener("click",async e=>{const b=e.target.closest("button[data-tab]");if(!b||state.user?.role!=="admin")return;state.tab=b.dataset.tab;state.selectedId="";document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===b));updateTabHint();await loadInquiries().catch(err=>toast(`加载失败：${err.message}`,true));});
    $("filters").addEventListener("submit",async e=>{e.preventDefault();await loadInquiries().catch(err=>toast(`加载失败：${err.message}`,true));}); $("filters").addEventListener("change",updateExportLink); $("resetFilters").addEventListener("click",async()=>{$("filters").reset();state.due="";history.replaceState(null,"",location.pathname);await loadInquiries().catch(err=>toast(`加载失败：${err.message}`,true));}); $("refresh").addEventListener("click",async()=>{await Promise.all([loadStats(),loadInquiries()]).catch(err=>toast(`刷新失败：${err.message}`,true));}); $("logoutBtn").addEventListener("click",async()=>{await fetch("/api/admin/logout",{method:"POST"}).catch(()=>{});window.location.href="/admin/login.html";}); $("manualBtn").addEventListener("click",()=>{ if(state.user?.role==="admin") $("manualDialog").showModal(); }); $("cancelManual").addEventListener("click",()=>$("manualDialog").close());
    $("saveManual").addEventListener("click",async e=>{e.preventDefault();try{const payload=Object.fromEntries(new FormData($("manualForm")));await apiJson("/api/admin/inquiries",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});$("manualDialog").close();$("manualForm").reset();await Promise.all([loadStats(),loadInquiries()]);toast("手动线索已新增。");}catch(err){toast(`新增失败：${err.message}`,true);}});
    $("confirmAssign").addEventListener("click",async e=>{e.preventDefault();await confirmAssign().catch(err=>toast(`分配失败：${err.message}`,true));});
    $("rows").addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(b){e.stopPropagation();try{if(b.dataset.action==="contact")await contactCustomer(b.dataset.id);if(b.dataset.action==="assign")openAssignDialog(b.dataset.id);if(b.dataset.action==="view-related")await openRelatedLead(b.dataset.leadId);}catch(err){toast(`操作失败：${err.message}`,true);}return;}const row=e.target.closest("tr[data-id]");if(row){state.selectedId=row.dataset.id;renderRows();renderDetail();}});
    $("detailPanel").addEventListener("click",async e=>{const item=selected();if(!item)return;const b=e.target.closest("button[data-detail-action]");if(!b)return;try{const a=b.dataset.detailAction;if(a==="copy-wa"){if(!item.whatsapp){toast("该线索暂无客户 WhatsApp。",true);return;}if(await copyText(item.whatsapp,`已复制 WhatsApp：${item.whatsapp}`)){b.textContent="已复制 ✓";setTimeout(()=>b.textContent="复制 WhatsApp",2000);}}if(a==="assign")openAssignDialog(item.id);if(a==="view-related")await openRelatedLead(b.dataset.leadId);if(a==="contact")await contactCustomer(item.id);if(a==="status"){await patchInquiry(item.id,{status:b.dataset.status},"status");toast("状态已更新。");}if(a==="note"){state.editingId=item.id;$("noteInput").value="";$("noteDialog").showModal();}if(a==="copy-url")await copyText(item.pageUrl||"","来源页面已复制。");if(a==="copy-notice"){const assignee=sales(item.assignedTo);if(!assignee){toast("请先分配负责人。",true);return;}await copyText(notificationText(item,assignee),"通知文案已复制。");}}catch(err){toast(`操作失败：${err.message}`,true);}});
    $("saveNote").addEventListener("click",async e=>{e.preventDefault();if(!state.editingId)return;try{await patchInquiry(state.editingId,{note:$("noteInput").value},"note");$("noteDialog").close();toast("跟进记录已保存。");}catch(err){toast(`保存失败：${err.message}`,true);}});
    (async()=>{try{await loadMe();applyInitialQueryFilters();updateTabHint();await loadSalesUsers();await Promise.all([loadStats(),loadInquiries()]);}catch(err){toast(err.message,true);}})();
  </script>
