<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工管理 | 中谷汽车官网后台</title>
  <style>
    body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.shell{width:min(1240px,calc(100% - 28px));margin:24px auto 46px}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#667085;line-height:1.55}.userbar,.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{min-height:30px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;background:#eaf2ff;color:#153f75;font-size:13px;font-weight:800}.btn{min-height:34px;padding:0 11px;border-radius:7px;border:1px solid #cfd7e6;background:#fff;color:#172033;cursor:pointer;text-decoration:none;font:inherit;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}.btn-primary{border-color:#153f75;background:#153f75;color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.panel{background:#fff;border:1px solid #e3e8f2;border-radius:8px;box-shadow:0 10px 28px rgba(15,23,42,.05)}.table-wrap{overflow:auto}table{width:100%;min-width:980px;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #edf1f7;text-align:left;vertical-align:middle}th{background:#f9fbff;color:#344054;white-space:nowrap}.badge{display:inline-flex;min-height:23px;align-items:center;padding:0 8px;border-radius:999px;font-size:12px;font-weight:800;background:#eef2ff;color:#3730a3}.badge-admin{background:#fee2e2;color:#991b1b}.badge-off{background:#eef2f7;color:#475467}.toast{position:fixed;right:22px;bottom:22px;z-index:99;min-width:240px;max-width:520px;padding:12px 14px;border-radius:8px;background:#123761;color:#fff;box-shadow:0 18px 46px rgba(15,23,42,.24);font-weight:800;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translateY(0)}.toast.error{background:#b42318}dialog{width:min(620px,calc(100% - 28px));border:0;border-radius:8px;padding:0;box-shadow:0 24px 60px rgba(15,23,42,.25)}dialog::backdrop{background:rgba(15,23,42,.42)}.dialog-body{padding:18px}.dialog-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field span{color:#344054;font-size:12px;font-weight:700}input,select{border:1px solid #cfd7e6;border-radius:7px;padding:8px 10px;font:inherit;font-size:13px;background:#fff}select[multiple]{min-height:116px}.check{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:760px){.topbar{flex-direction:column}.dialog-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div><h1>员工管理</h1><p>配置管理员和业务员账号、角色、WhatsApp、负责市场和启用状态。</p></div><div class="userbar"><span class="pill" id="currentUser">正在验证登录...</span><a class="btn" href="/admin/">后台首页</a><button class="btn btn-primary" id="newBtn" type="button">新增员工</button><button class="btn" id="logoutBtn" type="button">退出登录</button></div></header>
    <section class="panel"><div class="table-wrap"><table><thead><tr><th>姓名</th><th>用户名</th><th>角色</th><th>WhatsApp</th><th>负责市场</th><th>是否启用</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  </main>
  <dialog id="userDialog"><form method="dialog" class="dialog-body" id="userForm"><h2 id="dialogTitle" style="margin:0 0 12px;font-size:20px">新增员工</h2><input type="hidden" name="id"><div class="dialog-grid"><label class="field"><span>姓名</span><input name="name" required></label><label class="field"><span>用户名</span><input name="username" required></label><label class="field"><span>密码 / 重置密码</span><input name="password" type="password" autocomplete="new-password"></label><label class="field"><span>角色</span><select name="role"><option value="sales">sales</option><option value="admin">admin</option></select></label><label class="field"><span>WhatsApp</span><input type="text" name="whatsapp" placeholder="+86 186..."></label><label class="field"><span>负责市场</span><select name="markets" multiple></select></label><label class="check"><input name="active" type="checkbox" checked> 启用账号</label></div><div class="dialog-actions"><button class="btn" id="cancelBtn" type="button">取消</button><button class="btn btn-primary" id="saveBtn" type="submit">保存</button></div></form></dialog>
  <div class="toast" id="toast"></div>
  <script>
    const MARKETS=["All","Algeria","West Africa","Central Asia","Southeast Asia","Middle East","South America","Russia/CIS","Used Cars","Other"];
    const $=(id)=>document.getElementById(id);const esc=(v)=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const state={user:null,users:[],editingId:""};let toastTimer=null;
    function toast(text,isError=false){const box=$("toast");box.textContent=text;box.classList.toggle("error",isError);box.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove("show"),2600)}
    async function apiJson(url,options={}){const res=await fetch(url,{cache:"no-store",...options});if(res.status===401){location.href="/admin/login.html";return null}if(res.status===403){document.body.innerHTML='<main class="shell"><h1>无权访问</h1><p>员工管理只有 admin 可以访问。</p><p style="margin-top:14px"><a class="btn" href="/admin/">返回后台首页</a></p></main>';return null}const data=await res.json().catch(()=>({}));if(!res.ok||data.success===false)throw new Error(data.error||`status ${res.status}`);return data}
    function marketOptions(selected=[]){return MARKETS.map(m=>`<option value="${esc(m)}" ${selected.includes(m)?"selected":""}>${esc(m)}</option>`).join("")}
    function render(){ $("rows").innerHTML=state.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td><span class="badge badge-${esc(u.role)}">${esc(u.role)}</span></td><td>${esc(u.whatsapp||"-")}</td><td>${esc((u.markets||[]).join(", ")||"-")}</td><td>${u.active!==false?"启用":"<span class='badge badge-off'>禁用</span>"}</td><td class="actions"><button class="btn" data-edit="${esc(u.id)}">编辑</button></td></tr>`).join("") }
    async function loadMe(){const data=await apiJson("/api/admin/me");if(!data)return;state.user=data.user;$("currentUser").textContent=`${data.user.name} / ${data.user.role}`;if(data.user.role!=="admin"){location.href="/admin/"}}
    async function loadUsers(){const data=await apiJson("/api/admin/sales-users");if(!data)return;state.users=data.users||[];render()}
    function selectedMarkets(){return Array.from($("userForm").elements.markets.selectedOptions).map(o=>o.value)}
    function openDialog(user=null){state.editingId=user?.id||"";$("dialogTitle").textContent=user?"编辑员工":"新增员工";const f=$("userForm");f.reset();f.elements.id.value=user?.id||"";f.elements.name.value=user?.name||"";f.elements.username.value=user?.username||"";f.elements.username.disabled=!!user;f.elements.password.required=!user;f.elements.password.placeholder=user?"留空则不修改密码":"";f.elements.role.value=user?.role||"sales";f.elements.whatsapp.value=user?.whatsapp||"";f.elements.active.checked=user?.active!==false;f.elements.markets.innerHTML=marketOptions(user?.markets||[]);$("userDialog").showModal()}
    async function saveUser(e){e.preventDefault();const f=$("userForm");const payload={name:f.elements.name.value,role:f.elements.role.value,whatsapp:f.elements.whatsapp.value,markets:selectedMarkets(),active:f.elements.active.checked};if(!state.editingId){payload.username=f.elements.username.value;payload.password=f.elements.password.value}else if(f.elements.password.value){payload.password=f.elements.password.value}const url=state.editingId?`/api/admin/sales-users/${encodeURIComponent(state.editingId)}`:"/api/admin/sales-users";const method=state.editingId?"PATCH":"POST";await apiJson(url,{method,headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});$("userDialog").close();await loadUsers();toast(state.editingId?"员工信息已更新。":"员工已新增。")}
    $("newBtn").addEventListener("click",()=>openDialog());$("rows").addEventListener("click",e=>{const b=e.target.closest("button[data-edit]");if(b)openDialog(state.users.find(u=>u.id===b.dataset.edit))});$("cancelBtn").addEventListener("click",()=>$("userDialog").close());$("userForm").addEventListener("submit",e=>saveUser(e).catch(err=>toast(`保存失败：${err.message}`,true)));$("logoutBtn").addEventListener("click",async()=>{await fetch("/api/admin/logout",{method:"POST"}).catch(()=>{});location.href="/admin/login.html"});
    (async()=>{try{await loadMe();await loadUsers()}catch(err){toast(err.message,true)}})();
  </script>
</body>
</html>
