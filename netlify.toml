[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"
  ignore = "node scripts/netlify-ignore.js"


[functions]
  node_bundler = "esbuild"

[functions."dingtalk-inquiry-retry"]
  schedule = "*/5 * * * *"

[functions."dingtalk-inbox-qa-pair"]
  schedule = "0 0 29 2 *"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"

# Production redeploy trigger: 2026-07-27

# Google tracking enabled only for the verified production Web container.
[context.production.environment]
  ZHONGGU_GTM_ENABLED = "true"
  ZHONGGU_GTM_CONTAINER_ID = "GTM-TW4CPKSM"
